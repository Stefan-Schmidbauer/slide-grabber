name: Build Extension

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default, so a build triggered by a push or a pull request holds
# no write token at all. Only the release job widens this, and only for itself.
permissions:
  contents: read

# Third-party and first-party actions alike are pinned to a commit SHA: a tag
# like @v6 is mutable and would silently move if the action's repo were taken
# over. The trailing comment names the release each SHA belongs to.
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
      zip: ${{ steps.build.outputs.zip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No toolchain to install: the extension is vanilla JS and build.sh needs
      # only zip + jq, both present on ubuntu-latest.
      - name: Build extension zip
        id: build
        run: |
          ./build.sh
          VERSION="$(jq -r '.version' manifest.json)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=dist/slidegrabber-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      # A tag that disagrees with the manifest would publish a version nobody
      # can trace back to a commit, so fail before anything is uploaded.
      # MANIFEST comes in through env, never through ${{ }} inside the script:
      # its value is read out of manifest.json, and an expression interpolated
      # into a run block is substituted before the shell ever sees it.
      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MANIFEST: ${{ steps.build.outputs.version }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::tag v$TAG does not match manifest.json version $MANIFEST"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slidegrabber-extension
          path: ${{ steps.build.outputs.zip }}
          retention-days: 30

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # The only job that may write to the repo, and only on a tag.
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: slidegrabber-extension
          path: .

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: slidegrabber-${{ needs.build.outputs.version }}.zip
          generate_release_notes: true
          body: |
            ## Download

            | File | Description |
            |------|-------------|
            | `slidegrabber-${{ needs.build.outputs.version }}.zip` | Chrome extension (Manifest V3) |

            ## Installation

            Most people want the store version:
            **[Install from the Chrome Web Store](https://chromewebstore.google.com/detail/slidegrabber/mhppbdinngcdcbgafcppmcchpfjgmlnk)**

            To load this build directly instead:

            1. Download the zip
            2. Extract to a folder
            3. Open Chrome → `chrome://extensions/`
            4. Enable **Developer mode** (top right)
            5. Click **Load unpacked** → select the extracted folder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [build, release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # The four CWS_* secrets live in this environment, not in the repo, so no
    # other workflow and no other job in this one can read them. Restrict the
    # environment to the "v*" tags in the repo settings (Settings →
    # Environments → store → deployment branches and tags).
    environment: store
    # Needs no write access of its own: the release is already cut, and the
    # store upload authenticates against Google, not GitHub.
    permissions:
      contents: read
    steps:
      # Sparse: only the upload helper, not the whole tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: slidegrabber-extension
          path: .

      # Straight against the store's REST API with curl. The official CLI would
      # pull chrome-webstore-upload-cli plus its entire unpinned dependency tree
      # into the one job that holds all four store credentials — the exact path
      # the 2025 npm worms used to read secrets out of the environment. curl and
      # jq ship with the runner and need no install step.
      #
      # Uploads a new draft only — publishing stays a manual click in the
      # dashboard. Add a publish call against .../items/<id>/publish to skip it.
      - name: Upload to Chrome Web Store
        env:
          EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          ZIP: slidegrabber-${{ needs.build.outputs.version }}.zip
        run: |
          set -euo pipefail

          if [ -z "${EXTENSION_ID:-}" ]; then
            echo "::error::CWS_EXTENSION_ID is not set."
            exit 1
          fi
          [ -f "$ZIP" ] || { echo "::error::$ZIP not found in the downloaded artifact."; exit 1; }

          # Same trimming as the credential check: a stray newline in the id
          # would otherwise end up inside the upload URL.
          EXTENSION_ID="$(printf '%s' "$EXTENSION_ID" | tr -d '[:space:]')"

          ACCESS_TOKEN="$(.github/scripts/cws-token.sh)"

          RESPONSE="$(curl -sS \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-goog-api-version: 2" \
            -T "$ZIP" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${EXTENSION_ID}")"

          if printf '%s' "$RESPONSE" | jq -e '.error' >/dev/null 2>&1; then
            echo "::error::Upload rejected: $(printf '%s' "$RESPONSE" | jq -r '.error.message // .error')"
            exit 1
          fi

          STATE="$(printf '%s' "$RESPONSE" | jq -r '.uploadState // empty')"
          if [ "$STATE" != "SUCCESS" ]; then
            echo "::error::Upload finished with uploadState=${STATE:-none} (expected SUCCESS)."
            printf '%s' "$RESPONSE" | jq -r '.itemError[]? | "::error::\(.error_code): \(.error_detail)"'
            exit 1
          fi

          echo "Uploaded $ZIP as a new draft. Publish it by hand in the developer dashboard."
