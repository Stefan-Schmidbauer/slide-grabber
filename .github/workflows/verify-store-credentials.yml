name: Verify Store Credentials

# Read-only check that the four CWS_* secrets still work: exchanges the refresh
# token for an access token and reads the item's status from the Chrome Web
# Store API. It uploads nothing and publishes nothing, so it is safe to run at
# any time — e.g. before cutting a release tag, or after rotating a credential.
on:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange refresh token for an access token
        id: token
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          # `gh secret set < file` happily stores a trailing newline, which
          # Google then rejects as an invalid grant. Report it (never the value
          # itself) and carry on with the trimmed version.
          for NAME in CLIENT_ID CLIENT_SECRET REFRESH_TOKEN; do
            RAW="${!NAME}"
            TRIMMED="$(printf '%s' "$RAW" | tr -d '[:space:]')"
            if [ "${#RAW}" -ne "${#TRIMMED}" ]; then
              echo "::warning::CWS_${NAME} contains whitespace (${#RAW} chars vs ${#TRIMMED} trimmed) — re-set it without the trailing newline."
            fi
            declare "$NAME=$TRIMMED"
          done

          RESPONSE="$(curl -sS -X POST https://oauth2.googleapis.com/token \
            -d "client_id=${CLIENT_ID}" \
            -d "client_secret=${CLIENT_SECRET}" \
            -d "refresh_token=${REFRESH_TOKEN}" \
            -d "grant_type=refresh_token")"

          ACCESS_TOKEN="$(echo "$RESPONSE" | jq -r '.access_token // empty')"
          if [ -z "$ACCESS_TOKEN" ]; then
            ERROR="$(echo "$RESPONSE" | jq -r '.error // "unknown"')"
            echo "::error::Token exchange failed: ${ERROR} ($(echo "$RESPONSE" | jq -r '.error_description // "no description"'))"
            case "$ERROR" in
              invalid_client) echo "::error::The client id or client secret is wrong — check them against the OAuth client in the Google Cloud Console." ;;
              invalid_grant)  echo "::error::The refresh token is wrong, expired, revoked, or was issued for a different OAuth client than CWS_CLIENT_ID." ;;
            esac
            exit 1
          fi

          # Not a repo secret, so Actions would not mask it on its own.
          echo "::add-mask::$ACCESS_TOKEN"
          echo "token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"
          echo "Token exchange OK — client id, client secret and refresh token are valid."

      - name: Read item status from the Chrome Web Store API
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          ACCESS_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          if [ -z "$EXTENSION_ID" ]; then
            echo "::error::CWS_EXTENSION_ID is not set."
            exit 1
          fi

          RESPONSE="$(curl -sS \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-goog-api-version: 2" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${EXTENSION_ID}?projection=DRAFT")"

          if echo "$RESPONSE" | jq -e '.error' >/dev/null; then
            echo "::error::Item lookup failed: $(echo "$RESPONSE" | jq -r '.error.message // .error')"
            exit 1
          fi

          echo "Item lookup OK. Upload state: $(echo "$RESPONSE" | jq -r '.uploadState')"
          echo "All four CWS_* secrets are valid; a release tag would be able to upload a draft."
