name: Verify Store Credentials

# Read-only check that the four CWS_* secrets still work: exchanges the refresh
# token for an access token and reads the item's status from the Chrome Web
# Store API. It uploads nothing and publishes nothing, so it is safe to run at
# any time — e.g. before cutting a release tag, or after rotating a credential.
on:
  workflow_dispatch:

permissions:
  contents: read # only so the checkout below can fetch the helper script

jobs:
  verify:
    runs-on: ubuntu-latest
    # Same environment as the publish job: the CWS_* secrets are reachable from
    # nowhere else. Manual runs of this workflow may need an approval if the
    # environment has one.
    environment: store
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Exchange refresh token for an access token
        id: token
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(.github/scripts/cws-token.sh)"
          echo "token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Read item status from the Chrome Web Store API
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          ACCESS_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail

          if [ -z "${EXTENSION_ID:-}" ]; then
            echo "::error::CWS_EXTENSION_ID is not set."
            exit 1
          fi

          RESPONSE="$(curl -sS \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-goog-api-version: 2" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${EXTENSION_ID}?projection=DRAFT")"

          if printf '%s' "$RESPONSE" | jq -e '.error' >/dev/null 2>&1; then
            echo "::error::Item lookup failed: $(printf '%s' "$RESPONSE" | jq -r '.error.message // .error')"
            exit 1
          fi

          # The API answers a missing or inaccessible item with HTTP 200 and an
          # item object whose uploadState is NOT_FOUND — no error field — so
          # checking .error alone would report success on a dead credential set.
          STATE="$(printf '%s' "$RESPONSE" | jq -r '.uploadState // "none"')"
          case "$STATE" in
            SUCCESS|IN_PROGRESS)
              echo "Item lookup OK. Upload state: $STATE"
              echo "All four CWS_* secrets are valid; a release tag would be able to upload a draft."
              ;;
            NOT_FOUND)
              echo "::error::The store does not show this item to the authorised account (uploadState=NOT_FOUND)."
              echo "::error::Either CWS_EXTENSION_ID is wrong, or the refresh token was granted by a Google account that is not a publisher of this extension. The token itself is fine — step one passed."
              printf '%s' "$RESPONSE" | jq -r '.itemError[]? | "::error::\(.error_code): \(.error_detail)"'
              exit 1
              ;;
            *)
              echo "::error::Unexpected upload state: $STATE"
              printf '%s' "$RESPONSE" | jq -r '.itemError[]? | "::error::\(.error_code): \(.error_detail)"'
              exit 1
              ;;
          esac
